<section class="smiley-view" aria-labelledby="smiley-title">
  <div class="smiley-copy">
    <h1 id="smiley-title">CSS Smiley</h1>
  </div>

  <div class="smiley-stage" aria-label="A smiling face drawn with CSS">
    <div class="smiley-face">
      <div class="eyes" aria-hidden="true">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>

      <div class="smile" aria-hidden="true">
        <span class="mouth"></span>
        <span class="tongue"></span>
        <span class="face-cutout"></span>
      </div>
    </div>
  </div>
</section>
