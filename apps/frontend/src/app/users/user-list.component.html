<section class="users-view">
  <div class="users-header">
    <div>
      <h1>Users</h1>
    </div>

    <div class="header-actions">
      <button mat-flat-button type="button" (click)="openCreateDialog()">
        <mat-icon>person_add</mat-icon>
        Create user
      </button>
    </div>
  </div>

  <mat-form-field class="search-field" appearance="outline">
    <mat-label>Search full name</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput type="search" (input)="applySearch($event)" />
  </mat-form-field>

  @if (isLoading()) {
    <div class="state-panel">
      <mat-spinner diameter="36"></mat-spinner>
    </div>
  } @else if (errorMessage()) {
    <div class="state-panel error-state">
      <p>{{ errorMessage() }}</p>
      <button mat-flat-button type="button" (click)="loadUsers()">Retry</button>
    </div>
  } @else {
    <div class="table-shell">
      <mat-paginator
        [length]="filteredUsers().length"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="pageSizeOptions"
        (page)="handlePage($event)"
        showFirstLastButtons
        aria-label="Top user table pagination"
      ></mat-paginator>

      <table mat-table [dataSource]="pagedUsers()">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let user">{{ user.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let user">{{ fullName(user) }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let user">
            <span class="role-pill">{{ user.role }}</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          class="user-row"
          tabindex="0"
          *matRowDef="let row; columns: displayedColumns"
          (click)="openUserDetails(row)"
          (keydown.enter)="openUserDetails(row)"
        ></tr>

        <tr class="mat-row empty-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No users match the search.
          </td>
        </tr>
      </table>

      <mat-paginator
        [length]="filteredUsers().length"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="pageSizeOptions"
        (page)="handlePage($event)"
        showFirstLastButtons
        aria-label="Bottom user table pagination"
      ></mat-paginator>
    </div>
  }
</section>
